name: Build and deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - name: Build with public backend URL
        env:
          VITE_CHAT_API_URL: ${{ vars.VITE_CHAT_API_URL }}
        run: |
          if [ -z "$VITE_CHAT_API_URL" ]; then
            echo 'Set repository variable VITE_CHAT_API_URL before deploying.'
            exit 1
          fi
          case "$VITE_CHAT_API_URL" in
            https://*) ;;
            *) echo 'VITE_CHAT_API_URL must use HTTPS.'; exit 1 ;;
          esac
          npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
